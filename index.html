<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="description" content="Tablilla SAAC: comunicación aumentativa y alternativa para niños." />
  <title>Tablilla SAAC</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a href="#tablero" class="skip-link">Saltar al tablero</a>

  <!-- ===== Barra superior ===== -->
  <header class="topbar" role="banner">
    <div class="topbar__left">
      <button id="btnProfiles" class="icon-btn" aria-label="Cambiar perfil" title="Perfiles">
        <span id="profileAvatar" aria-hidden="true">🧒</span>
      </button>
      <div class="topbar__titles">
        <h1 class="app-title">Tablilla SAAC</h1>
        <p id="profileName" class="profile-name">Perfil</p>
      </div>
    </div>

    <div class="topbar__right">
      <span id="netStatus" class="net-status" role="status" aria-live="polite" title="Estado de conexión">
        <span class="net-dot" aria-hidden="true"></span>
        <span class="net-label">En línea</span>
      </span>
      <button id="btnHelp" class="icon-btn" aria-label="Ayuda y atajos" title="Ayuda">❔</button>
      <button id="btnContrast" class="icon-btn" aria-label="Alternar alto contraste" title="Alto contraste" aria-pressed="false">◐</button>
      <button id="btnSize" class="icon-btn" aria-label="Cambiar tamaño de pictogramas" title="Tamaño">Aa</button>
      <button id="btnSettings" class="icon-btn" aria-label="Abrir ajustes" title="Ajustes">⚙️</button>
    </div>
  </header>

  <!-- ===== Barra de frase ===== -->
  <section class="phrase-bar" aria-label="Barra de frase">
    <div id="phraseItems" class="phrase-items" role="list" aria-live="polite" aria-label="Frase en construcción">
      <span class="phrase-empty" id="phraseEmpty">Toca pictogramas para formar una frase…</span>
    </div>
    <div class="phrase-actions">
      <button id="btnSpeak" class="action-btn action-btn--primary" aria-label="Reproducir frase">▶ Hablar</button>
      <button id="btnBackspace" class="action-btn" aria-label="Borrar último pictograma">⌫</button>
      <button id="btnClear" class="action-btn" aria-label="Limpiar frase">🗑</button>
      <button id="btnSavePhrase" class="action-btn" aria-label="Guardar frase frecuente">⭐</button>
    </div>
  </section>

  <!-- ===== Contenido principal ===== -->
  <main class="layout">
    <!-- Categorías -->
    <nav id="categories" class="categories" aria-label="Categorías de pictogramas"></nav>

    <!-- Tablero de pictogramas -->
    <section id="tablero" class="board" aria-label="Pictogramas">
      <div class="board__header">
        <h2 id="boardTitle" class="board__title">Necesidades</h2>
        <div class="board__tools">
          <button id="btnManageBoards" class="icon-btn icon-btn--sm" aria-label="Gestionar tableros" title="Gestionar tableros">🗂️</button>
          <button id="btnEditBoard" class="icon-btn icon-btn--sm" aria-label="Editar tablero" title="Editar tablero">✏️</button>
        </div>
      </div>

      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input id="searchInput" class="search-input" type="search" placeholder="Buscar pictograma en todos los tableros…" aria-label="Buscar pictograma" autocomplete="off" />
        <button id="btnClearSearch" class="search-clear" aria-label="Limpiar búsqueda" hidden>✕</button>
      </div>

      <div id="pictoGrid" class="picto-grid" role="list"></div>
      <p id="boardEmpty" class="board-empty" hidden>No hay pictogramas que coincidan.</p>
    </section>

    <!-- Panel lateral: frases frecuentes + recientes -->
    <aside class="sidebar" aria-label="Frases">
      <section class="frequent" aria-label="Frases frecuentes">
        <h2 class="frequent__title">⭐ Frases frecuentes</h2>
        <div id="frequentList" class="frequent__list"></div>
      </section>
      <section class="frequent" aria-label="Frases recientes">
        <h2 class="frequent__title">🕘 Recientes</h2>
        <div id="recentList" class="frequent__list"></div>
      </section>
    </aside>
  </main>

  <!-- ===== Panel de ajustes (drawer) ===== -->
  <div id="settingsOverlay" class="overlay" hidden></div>
  <aside id="settingsPanel" class="panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
    <div class="panel__header">
      <h2 id="settingsTitle">Ajustes</h2>
      <button id="btnCloseSettings" class="icon-btn" aria-label="Cerrar ajustes">✕</button>
    </div>

    <div class="panel__body">
      <section class="panel__section">
        <h3>Voz</h3>
        <label class="field">
          <span>Voz</span>
          <select id="voiceSelect"></select>
        </label>
        <label class="field">
          <span>Velocidad: <output id="rateOut">1.0</output></span>
          <input id="rateRange" type="range" min="0.5" max="1.8" step="0.1" value="1" />
        </label>
        <label class="field">
          <span>Tono: <output id="pitchOut">1.0</output></span>
          <input id="pitchRange" type="range" min="0.5" max="1.8" step="0.1" value="1" />
        </label>
        <button id="btnTestVoice" class="action-btn">Probar voz</button>
        <label class="switch" style="margin-top:12px;">
          <input id="toggleSpeakOnTap" type="checkbox" />
          <span>Pronunciar al tocar pictograma</span>
        </label>
        <label class="switch">
          <input id="toggleAutoSpeak" type="checkbox" />
          <span>Hablar automáticamente al completar frase</span>
        </label>
      </section>

      <section class="panel__section">
        <h3>Accesibilidad</h3>
        <label class="switch">
          <input id="toggleContrast" type="checkbox" />
          <span>Alto contraste</span>
        </label>
        <label class="field">
          <span>Tamaño de pictogramas</span>
          <select id="sizeSelect">
            <option value="sm">Pequeño</option>
            <option value="md">Mediano</option>
            <option value="lg">Grande</option>
          </select>
        </label>
      </section>

      <section class="panel__section">
        <h3>Perfiles</h3>
        <div id="profileList" class="profile-list"></div>
        <button id="btnAddProfile" class="action-btn">+ Nuevo perfil</button>
      </section>

      <section class="panel__section">
        <h3>Terapeuta</h3>
        <label class="switch">
          <input id="toggleLock" type="checkbox" />
          <span>Bloquear edición</span>
        </label>
        <button id="btnSetPin" class="action-btn">Cambiar PIN</button>
        <button id="btnAnalytics" class="action-btn">Ver analítica</button>
        <button id="btnExportCsv" class="action-btn">Exportar uso (CSV)</button>
      </section>

      <section class="panel__section">
        <h3>Tableros</h3>
        <div id="boardList" class="profile-list"></div>
        <button id="btnAddBoard" class="action-btn">+ Nuevo tablero</button>
        <button id="btnExportBoard" class="action-btn">Exportar tablero actual (JSON)</button>
      </section>

      <section class="panel__section">
        <h3>Datos</h3>
        <button id="btnExportJson" class="action-btn">Exportar todo (JSON)</button>
        <label class="action-btn action-btn--file">
          Importar (JSON)
          <input id="importJson" type="file" accept="application/json" hidden />
        </label>
        <button id="btnReset" class="action-btn action-btn--danger">Restablecer datos</button>
      </section>
    </div>
  </aside>

  <!-- ===== Modal genérico ===== -->
  <div id="modalOverlay" class="overlay" hidden></div>
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal__header">
      <h2 id="modalTitle">Título</h2>
      <button id="btnCloseModal" class="icon-btn" aria-label="Cerrar">✕</button>
    </div>
    <div id="modalBody" class="modal__body"></div>
    <div id="modalFooter" class="modal__footer"></div>
  </div>

  <!-- ===== Toast ===== -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="data/pictogramas.js"></script>
  <script src="app.js"></script>
</body>
</html>
